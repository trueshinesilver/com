<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Order Confirmed — True Shine Silver</title>
  <meta name="theme-color" content="#070708">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="success">
<main>
  <div class="wrap"><div class="success" id="root"></div></div>
</main>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
window.TS_PAGE = () => {
  const { store, money, esc, I } = TS;
  const o = store.get("ts_last_order", null);
  const root = document.getElementById("root");
  if (!o) { root.innerHTML = `<h1 class="h-section">No recent order</h1><p class="lead" style="margin:16px auto 30px">Looks like you haven't placed an order yet.</p><a class="btn" href="shop.html">Shop the collection</a>`; return; }
  const msg = `Hi True Shine Silver! I just placed order ${o.no}.\nName: ${o.customer.name}\nCity: ${o.customer.city}\nPayment: ${o.payment}\nTotal: ${money(o.totals.total)}\n\nItems:\n${o.items.map(i => `• ${i.name}${i.size ? " (" + i.size + ")" : ""} × ${i.qty}`).join("\n")}`;
  root.innerHTML = `
    <svg class="check-anim" viewBox="0 0 110 110" fill="none" stroke="#e6e7ea" stroke-width="2"><circle cx="55" cy="55" r="52"/><path d="M34 57l14 14 28-30" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="eyebrow hero-fade">Order ${esc(o.no)}</span>
    <h1 class="h-section hero-fade d1">Thank you, <em>${esc(o.customer.name.split(" ")[0])}</em>.</h1>
    <p class="lead hero-fade d2" style="margin:18px auto 0">Your order has been received. Our team will call or WhatsApp you on <b style="color:var(--text)">${esc(o.customer.phone)}</b> to confirm before dispatch.</p>
    <div class="order-box hero-fade d3">
      ${o.items.map(i => `<div class="co-item" style="margin-bottom:14px"><div class="ph"><img src="${i.img.replace("w=900", "w=200")}" alt=""><span class="q">${i.qty}</span></div><div><h5>${esc(i.name)}</h5><span>${i.size ? "Size " + esc(i.size) : "925 Silver"}</span></div><span class="price">${money(i.price * i.qty)}</span></div>`).join("")}
      <div class="sum-line"><span>Subtotal</span><span>${money(o.totals.sub)}</span></div>
      ${o.totals.discount ? `<div class="sum-line"><span>Discount</span><span>− ${money(o.totals.discount)}</span></div>` : ""}
      <div class="sum-line"><span>Delivery</span><span>${o.totals.shipping ? money(o.totals.shipping) : "Free"}</span></div>
      ${o.totals.gift ? `<div class="sum-line"><span>Gift wrapping</span><span>${money(o.totals.gift)}</span></div>` : ""}
      <div class="sum-line total"><span>Total · ${esc(o.payment)}</span><b>${money(o.totals.total)}</b></div>
      <div style="margin-top:20px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)"><b style="color:var(--text);font-weight:500">Delivering to</b><br>${esc(o.customer.address)}, ${esc(o.customer.city)}</div>
    </div>
    <div class="hero-cta" style="justify-content:center">
      <a class="btn wa-btn" target="_blank" rel="noopener" href="https://wa.me/${STORE.whatsapp}?text=${encodeURIComponent(msg)}">${I.wa.replace("<svg", '<svg width="18" height="18"')} Confirm on WhatsApp</a>
      <a class="btn btn-ghost" href="shop.html">Continue shopping</a>
    </div>`;
};
</script>
</body>
</html>
